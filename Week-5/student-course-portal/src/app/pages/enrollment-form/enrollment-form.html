<div class="form-container">

  <h1>Student Enrollment Request</h1>

  <form
    #enrollForm="ngForm"
    (ngSubmit)="onSubmit(enrollForm)"
    novalidate>

    <div class="form-group">
      <label for="studentName">Student Name</label>

      <input
        id="studentName"
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        #nameCtrl="ngModel"
        required
        minlength="3">

      <span
        class="error"
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
        Name is required
      </span>

      <span
        class="error"
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
        Name must be at least 3 characters
      </span>
    </div>

    <div class="form-group">
      <label for="studentEmail">Student Email</label>

      <input
        id="studentEmail"
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        #emailCtrl="ngModel"
        required
        email>

      <span
        class="error"
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
        Email is required
      </span>

      <span
        class="error"
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
        Enter a valid email address
      </span>
    </div>

    <div class="form-group">
      <label for="courseId">Course ID</label>

      <input
        id="courseId"
        type="number"
        name="courseId"
        [(ngModel)]="courseId"
        #courseCtrl="ngModel"
        required>

      <span
        class="error"
        *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
        Course ID is required
      </span>
    </div>

    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>

      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="preferredSemester">

        <option value="">Select Semester</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>

      </select>
    </div>

    <div class="checkbox-group">

      <input
        id="agreeToTerms"
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        #termsCtrl="ngModel"
        required>

      <label for="agreeToTerms">
        I agree to the terms and conditions
      </label>

    </div>

    <span
      class="error"
      *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
      You must agree to the terms
    </span>

    <div class="button-group">

      <button
        type="submit"
        [disabled]="enrollForm.invalid">
        Submit
      </button>

      <button
        type="button"
        (click)="onReset(enrollForm)">
        Reset
      </button>

    </div>

  </form>

  <div
    class="success"
    *ngIf="submitted">

    Enrollment request submitted successfully!

  </div>

</div>
