<h1>{{ portalName }}</h1>

<p>Courses Available: {{ availableCourses }}</p>

<p>
  Enrollment Status:
  {{ isPortalActive ? 'Active' : 'Inactive' }}
</p>

<button
  type="button"
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<h2>Course Search</h2>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Enter Course Name">

<p>You entered: {{ searchTerm }}</p>
