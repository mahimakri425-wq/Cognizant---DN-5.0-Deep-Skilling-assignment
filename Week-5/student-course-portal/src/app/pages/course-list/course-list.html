<section class="course-list-page">

  <h2>Available Courses</h2>

  @if (isLoading()) {

    <p>Loading courses...</p>

  } @else {

    <p>Total courses: {{ courses.length }}</p>

    <div class="course-grid">

      @for (course of courses; track course.id) {

        <app-course-card
          [course]="course">
        </app-course-card>

      } @empty {

        <p>No courses are available.</p>

      }

    </div>

  }

</section>
