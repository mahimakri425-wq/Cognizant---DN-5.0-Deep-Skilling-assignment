<h2>Available Courses</h2>

<div>
  <input
    type="text"
    [(ngModel)]="searchText"
    placeholder="Search courses"
    (keyup.enter)="searchCourses()"
  />

  <button type="button" (click)="searchCourses()">
    Search
  </button>
</div>

<p *ngIf="isLoading">
  Loading courses...
</p>

<div *ngIf="!isLoading && errorMessage">
  <p style="color: red;">
    {{ errorMessage }}
  </p>

  <button type="button" (click)="loadCourses()">
    Retry
  </button>
</div>

<div *ngIf="!isLoading && !errorMessage">

  <p>Total Courses: {{ filteredCourses.length }}</p>

  <p *ngIf="filteredCourses.length === 0">
    No courses found.
  </p>

  <div *ngFor="let course of filteredCourses">
    <h3>{{ course.name }}</h3>

    <p><strong>Code:</strong> {{ course.code }}</p>
    <p><strong>Credits:</strong> {{ course.credits }}</p>
    <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

    <hr />
  </div>

</div>
