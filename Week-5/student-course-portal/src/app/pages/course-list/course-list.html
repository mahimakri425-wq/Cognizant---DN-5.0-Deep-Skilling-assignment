<h1>Available Courses</h1>

<p *ngIf="isLoading()">
  Loading courses...
</p>

<div *ngIf="!isLoading()">

  <div
    *ngFor="let course of courses; trackBy: trackByCourseId"
    [appHighlight]="'#f1f8ff'">

    <app-course-card
      [course]="course"
      (enrollRequested)="onEnroll($event)">
    </app-course-card>

  </div>

  <p *ngIf="selectedCourseId !== null">
    <strong>Selected Course ID:</strong>
    {{ selectedCourseId }}
  </p>

</div>
