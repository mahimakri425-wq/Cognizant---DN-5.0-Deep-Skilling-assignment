<div class="notification-box">

  <h3>Notifications</h3>

  <button
    type="button"
    (click)="addNotification()">
    Add Notification
  </button>

  <button
    type="button"
    (click)="clearNotifications()">
    Clear
  </button>

  @if (notificationService.getMessages().length > 0) {

    <ul>

      @for (
        message of notificationService.getMessages();
        track $index
      ) {
        <li>{{ message }}</li>
      }

    </ul>

  } @else {

    <p>No notifications.</p>

  }

</div>
